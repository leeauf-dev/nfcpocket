name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without v (for example: 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the x.y.z format, for example 0.2.0." >&2
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1 || git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag or release $TAG already exists." >&2
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "Calculated Android version code is outside the supported range." >&2
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "Required signing secret $secret is missing." >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nfcpocket-release.p12"
          ./gradlew assembleRelease \
            -PreleaseVersionName="$VERSION_NAME" \
            -PreleaseVersionCode="$VERSION_CODE" \
            -PreleaseStoreFile="$RUNNER_TEMP/nfcpocket-release.p12" \
            -PreleaseStorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="nfcpocket" \
            -PreleaseKeyPassword="$ANDROID_KEY_PASSWORD"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NFC-Pocket-$TAG.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Verify APK signature
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/NFC-Pocket-$TAG.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nfcpocket-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          RELEASE_FLAGS=(--target "$GITHUB_SHA" --generate-notes --title "NFC Pocket $TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease)
          else
            RELEASE_FLAGS+=(--latest)
          fi
          gh release create "$TAG" dist/* "${RELEASE_FLAGS[@]}"
